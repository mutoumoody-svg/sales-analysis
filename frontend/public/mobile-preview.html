<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>移动端预览</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f0f0f0;
      font-family: sans-serif;
    }
    .preview-label {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .phone-frame {
      width: 375px;
      height: 812px;
      margin: 0 auto;
      background: #fff;
      border: 12px solid #222;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      position: relative;
    }
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 25px;
      background: #222;
      border-radius: 0 0 15px 15px;
      z-index: 1000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="preview-label">📱 iPhone 12 Pro 模拟视图（375 × 812）</div>
  <div class="phone-frame">
    <div class="notch"></div>
    <iframe src="/"></iframe>
  </div>
</body>
</html>
