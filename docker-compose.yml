services:
  # ============ PostgreSQL Database ============
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: sales_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01-init_db.sql
      - ./database/migrate_v2.sql:/docker-entrypoint-initdb.d/02-migrate_v2.sql
      - ./database/migrate_v3.sql:/docker-entrypoint-initdb.d/03-migrate_v3.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ FastAPI Backend ============
  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?请在.env中设置DB_PASSWORD}@db:5432/sales_analysis
      API_V1_PREFIX: /api/v1
      APP_NAME: AI Business Decision Platform
      DEBUG: "false"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"

  # ============ Frontend (Nginx + React) ============
  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    # For HTTPS, uncomment below and add certs
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
