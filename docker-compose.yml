services:
  # ============ PostgreSQL Database ============
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: sales_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_db.sql:/docker-entrypoint-initdb.d/01-init_db.sql
      - ./database/migrate_v2.sql:/docker-entrypoint-initdb.d/02-migrate_v2.sql
      - ./database/migrate_v3.sql:/docker-entrypoint-initdb.d/03-migrate_v3.sql
      - ./database/migrate_v4.sql:/docker-entrypoint-initdb.d/04-migrate_v4.sql
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============ FastAPI Backend ============
  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?请在.env中设置DB_PASSWORD}@db:5432/sales_analysis
      API_V1_PREFIX: /api/v1
      APP_NAME: ${APP_NAME:-AI Business Decision Platform}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?请在.env中设置ADMIN_API_KEY}
      WANGDIAN_SID: ${WANGDIAN_SID:-}
      WANGDIAN_APPKEY: ${WANGDIAN_APPKEY:-}
      WANGDIAN_APPSECRET: ${WANGDIAN_APPSECRET:-}
      WANGDIAN_SANDBOX: ${WANGDIAN_SANDBOX:-false}
      KUCUN_OUTPUT_PATH: ${KUCUN_OUTPUT_PATH:-/opt/kucun/output}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  # ============ Frontend (Nginx + React) ============
  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    # For HTTPS, uncomment below and add certs
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro

volumes:
  pgdata:
